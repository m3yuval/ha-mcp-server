name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: ha-mcp
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ha-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  entrypoint:
    name: Entrypoint script
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck -s sh ha-mcp/rootfs/usr/bin/ha-mcp-run

  lint:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # https://github.com/frenck/action-addon-linter (used by the official apps-example)
      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./ha-mcp"

  build:
    name: Build ${{ matrix.arch }} image (no push)
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Official Home Assistant builder action (BuildKit). Build only: nothing
      # is pushed or signed. The add-on is built locally by the Supervisor for now.
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./ha-mcp
          image: local/${{ matrix.arch }}-ha-mcp
          image-tags: test
          version: test
          push: "false"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
